    <text x="306" y="558" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">м. Чернышевская · Суворовский, 35</text>
    <text x="562" y="558" font-size="20" font-weight="700" fill="#22d3ee">+7 (921) 915-62-55</text>
