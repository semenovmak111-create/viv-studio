  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="120" cy="70" r="420" fill="url(#g1)"/>
  <circle cx="1120" cy="560" r="400" fill="url(#g2)"/>
  <circle cx="980" cy="120" r="300" fill="url(#g3)"/>

  <g transform="translate(960 330)">
    <path d="M0-182C104-182 186-96 176 6 166 108 92 186-8 182-108 178-180 96-178-6-176-108-104-182 0-182z" fill="url(#blob)" opacity=".95"/>
    <g fill="none" stroke="#ffffff" stroke-opacity=".32">
      <circle r="150" stroke-width="1"/><circle r="104" stroke-width="1"/>
    </g>
    <path d="M0-158 L0 -12" stroke="url(#beam)" stroke-width="46" stroke-linecap="round"/>
    <path d="M0-158 L0 -12" stroke="#ffffff" stroke-opacity=".55" stroke-width="1.6"/>
    <circle cy="-6" r="10" fill="#22d3ee"/>
  </g>

  <g font-family="Manrope, Segoe UI, Arial, sans-serif">
    <text x="80" y="106" font-size="20" font-weight="800" letter-spacing="6" fill="url(#txt)">VIV.STUDIO</text>
    <path d="M80 128 h92" stroke="#8b5cf6" stroke-width="1.4" stroke-opacity=".8"/>
    <text x="80" y="160" font-size="17" letter-spacing="1.6" fill="#bda9e0">ЛАЗЕРНАЯ ЭПИЛЯЦИЯ И КОСМЕТОЛОГИЯ · САНКТ-ПЕТЕРБУРГ</text>
