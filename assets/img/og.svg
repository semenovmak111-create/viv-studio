      <stop offset="0" stop-color="#150a29"/><stop offset=".55" stop-color="#0d0618"/><stop offset="1" stop-color="#180a2e"/>
    </linearGradient>
    <radialGradient id="g1" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".85"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e83fa4" stop-opacity=".7"/><stop offset="1" stop-color="#e83fa4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".45"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".95"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
