    <text x="80" y="326" font-size="47">всего тела — <tspan fill="url(#txt)">4 900 ₽</tspan></text>
    <text x="80" y="390" font-size="47">вместо 9 800 ₽</text>
  </g>

  <g font-family="Manrope, Segoe UI, Arial, sans-serif" fill="#bda9e0" font-size="21">
