<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>OG-картинка VIV.STUDIO</title>
<!--
  Исходник картинки для мессенджеров и соцсетей (og.png, 1200×630).
  Пересобрать после правки:

    chrome --headless=new --disable-gpu --hide-scrollbars \
      --window-size=1200,630 --virtual-time-budget=4000 \
      --screenshot=assets/img/og.png assets/img/og-source.html

  Правило то же, что на сайте: первым читается выгода и цена, а не логотип.
-->
<style>
@font-face{font-family:'Prata';font-style:normal;font-weight:400;
  src:url(../fonts/prata-cyrillic.woff2) format('woff2');
  unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Prata';font-style:normal;font-weight:400;
  src:url(../fonts/prata-latin.woff2) format('woff2')}
@font-face{font-family:'Onest';font-style:normal;font-weight:300 800;
  src:url(../fonts/onest-cyrillic.woff2) format('woff2');
  unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Onest';font-style:normal;font-weight:300 800;
  src:url(../fonts/onest-latin.woff2) format('woff2')}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:630px;overflow:hidden;position:relative;
  font-family:'Onest',sans-serif;color:#F2EAE9;
  background:
    radial-gradient(70% 62% at 76% 2%,rgba(226,190,134,.26),transparent 64%),
    radial-gradient(60% 58% at 6% 96%,rgba(150,110,220,.22),transparent 66%),
    linear-gradient(150deg,#1A0F22,#120B18 48%,#0C0712)}
.nets{position:absolute;inset:0;opacity:.5;
  background:repeating-linear-gradient(90deg,rgba(255,240,220,.05) 0 1px,transparent 1px 96px);
  mask-image:linear-gradient(180deg,#000,transparent 82%)}
.arch{position:absolute;right:64px;top:66px;width:380px;height:498px;
  border-radius:999px 999px 26px 26px;overflow:hidden;
  border:1px solid rgba(226,190,134,.34);
  box-shadow:inset 0 0 90px rgba(226,190,134,.16)}
.arch svg{width:100%;height:100%;display:block}
.in{position:absolute;left:70px;top:132px;width:620px}
.tag{display:inline-flex;align-items:center;gap:9px;padding:8px 16px;border-radius:999px;
  border:1px solid rgba(226,190,134,.3);background:rgba(226,190,134,.08);
  font-size:14px;color:#F6E6C6;margin-bottom:26px}
.tag i{width:7px;height:7px;border-radius:50%;background:#E2BE86;box-shadow:0 0 10px #E2BE86}
h1{font-family:'Prata',serif;font-weight:400;font-size:46px;line-height:1.12;letter-spacing:-.015em}
h1 span{background:linear-gradient(120deg,#F6E6C6,#E2BE86 42%,#C89B57);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin-top:18px;font-size:19px;line-height:1.45;color:#B3A4B4;max-width:520px}
.tk{--cut:18px;margin-top:34px;padding:1px;width:max-content;
  background:linear-gradient(130deg,rgba(226,190,134,.75),rgba(226,190,134,.16) 55%,rgba(226,190,134,.5));
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
.tk-in{--cut:18px;display:flex;align-items:center;gap:22px;padding:18px 24px;background:rgba(10,6,14,.86);
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
.tk-l{display:block;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#E2BE86}
.tk-p{font-family:'Prata',serif;font-size:44px;line-height:1.05;color:#FFF8F0}
.tk-w{font-size:15px;line-height:1.45;color:#B3A4B4}
.tk-w s{color:#8B7D8F}
.tk-save{padding:8px 15px;border-radius:999px;font-size:14px;font-weight:800;color:#1A1016;
  background:linear-gradient(120deg,#F6E6C6,#E2BE86 42%,#C89B57)}
.lg{position:absolute;left:70px;top:52px;display:flex;align-items:center;gap:16px}
.lm{font-family:'Prata',serif;font-size:26px;letter-spacing:.1em;color:#FFF6EE}
.ld{font-size:14px;line-height:1.3;color:#8B7D8F;border-left:1px solid rgba(240,224,206,.18);padding-left:16px}
</style>
</head>
<body>
<div class="nets"></div>

<div class="arch">
  <svg viewBox="0 0 380 498" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="a" x1=".15" y1="0" x2=".85" y2="1">
        <stop offset="0" stop-color="#3B2245"/><stop offset=".45" stop-color="#4A2B3E"/><stop offset="1" stop-color="#1A1020"/>
      </linearGradient>
      <radialGradient id="b" cx=".54" cy=".2" r=".62">
        <stop offset="0" stop-color="#FFE7C2" stop-opacity=".55"/>
        <stop offset=".55" stop-color="#FFD9A8" stop-opacity=".12"/>
        <stop offset="1" stop-color="#FFD9A8" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="c" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FFEFD4" stop-opacity=".75"/>
        <stop offset=".75" stop-color="#FFEFD4" stop-opacity=".1"/>
        <stop offset="1" stop-color="#FFEFD4" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <rect width="380" height="498" fill="url(#a)"/>
    <ellipse cx="206" cy="112" rx="230" ry="200" fill="url(#b)"/>
    <path d="M206 18 L206 278" stroke="url(#c)" stroke-width="56" stroke-linecap="round"/>
    <path d="M206 18 L206 278" stroke="#FFF3DF" stroke-opacity=".7" stroke-width="1"/>
    <circle cx="206" cy="278" r="6" fill="#F6E6C6"/>
    <circle cx="206" cy="278" r="20" fill="none" stroke="#FFF3DF" stroke-opacity=".4"/>
    <circle cx="206" cy="278" r="36" fill="none" stroke="#FFF3DF" stroke-opacity=".18"/>
    <g fill="none" stroke="#FFF3DF" stroke-opacity=".22">
      <path d="M-20 372c70-30 128-30 190 0s130 34 228 4"/>
      <path d="M-20 398c70-30 128-30 190 0s130 34 228 4"/>
      <path d="M-20 424c70-30 128-30 190 0s130 34 228 4"/>
    </g>
  </svg>
</div>

<div class="in">
  <div class="tag"><i></i> Суворовский пр-кт, 35 · 6 минут от м. Чернышевская</div>
  <h1>Всё тело — 40 минут.<br><span>Первый визит 4 900 ₽</span></h1>
  <p class="sub">Одна клиентка в студии, отдельный кабинет и один косметолог с медицинским образованием.</p>
  <div class="tk"><div class="tk-in">
    <div><span class="tk-l">Первый визит</span><span class="tk-p">4 900 ₽</span></div>
    <div class="tk-w">вместо <s>9 800 ₽</s><br>комплекс «всё тело»</div>
    <div class="tk-save">−50%</div>
  </div></div>
</div>

<div class="lg">
  <span class="lm">VIV.STUDIO</span>
  <span class="ld">Лазерная эпиляция<br>и косметология</span>
</div>
</body>
</html>
